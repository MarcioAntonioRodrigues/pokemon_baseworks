
<main>
    <section class="display-list">
        <h3>Selecione o tipo de Pokemon</h3>
        <article class="dynamic-display" *ngFor="let type of pokemonTypesList">
            <div class="type-card dynamic-display" (click)="onClickPokemonTypeBtn(type.url)">{{type.name}}</div>
        </article>
    </section>
    <pokemon-type></pokemon-type>
</main>
