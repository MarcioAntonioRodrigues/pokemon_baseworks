
<main>
    <mat-form-field class="display-list">
        <mat-label>Selecione o tipo de Pokemon</mat-label>
        <mat-select>
            <mat-option
                [value]="type.name"
                *ngFor="let type of pokemonTypesList"
                (click)="onClickPokemonTypeBtn(type)">
                {{type.name}}
            </mat-option>
        </mat-select>
    </mat-form-field>
    <pokemon-type></pokemon-type>
</main>
